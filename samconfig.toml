# AWS SAM CLI configuration file
# See: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html

version = 0.1

[default]
[default.global.parameters]
stack_name = "vpn-control-api"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Uncomment and set your EC2 instance ID before deploying:
# parameter_overrides = "EC2InstanceId=i-1234567890abcdef0 EC2Region=us-west-2 CustomDomainName=toggle-vpn.your-domain.com"

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Production environment configuration
[prod]
[prod.deploy.parameters]
stack_name = "vpn-control-api-prod"
s3_prefix = "vpn-control-api-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# parameter_overrides = "EC2InstanceId=i-YOUR_PROD_INSTANCE EC2Region=us-west-2 StageName=prod CustomDomainName=toggle-vpn.your-domain.com"

# Development/testing environment configuration
[dev]
[dev.deploy.parameters]
stack_name = "vpn-control-api-dev"
s3_prefix = "vpn-control-api-dev"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
# parameter_overrides = "EC2InstanceId=i-YOUR_DEV_INSTANCE EC2Region=us-west-2 StageName=dev"
